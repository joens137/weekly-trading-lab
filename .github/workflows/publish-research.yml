name: Publish weekly research results

on:
  schedule:
    # Mondays after the US stock market close (23:15 UTC).
    - cron: '15 23 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-research-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate research snapshots
        run: python sync_research_results.py
      - name: Commit and publish only public research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_results/
          if git diff --cached --quiet; then
            echo "No new or changed snapshots"
          else
            git commit -m "data: refresh public weekly research results"
            git push
          fi
